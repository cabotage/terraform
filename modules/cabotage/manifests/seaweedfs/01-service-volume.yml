apiVersion: v1
kind: Service
metadata:
  namespace: cabotage
  name: seaweedfs-volume
  labels:
    app: seaweedfs
    component: volume
    cabotage.io/infra: "true"
spec:
  clusterIP: None
  ports:
    - port: 8080
      name: http
    - port: 18080
      name: grpc
  selector:
    app: seaweedfs
    component: volume
  publishNotReadyAddresses: true
