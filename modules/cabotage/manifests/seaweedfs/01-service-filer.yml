apiVersion: v1
kind: Service
metadata:
  namespace: cabotage
  name: seaweedfs-filer
  labels:
    app: seaweedfs
    component: filer
    cabotage.io/infra: "true"
spec:
  clusterIP: None
  ports:
    - port: 8888
      name: http
    - port: 18888
      name: grpc
  selector:
    app: seaweedfs
    component: filer
  publishNotReadyAddresses: true
