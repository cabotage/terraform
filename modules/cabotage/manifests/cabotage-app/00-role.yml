apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  namespace: cabotage-app
  name: cabotage-deployments
rules:
  - verbs:
      - get
      - list
      - create
      - patch
      - delete
    apiGroups:
      - "cabotage.io"
    resources:
      - cabotageenrollments
      - cabotagetailscaleoperatorconfigs
  - verbs:
      - get
      - list
      - create
      - update
      - patch
      - delete
      - watch
    apiGroups:
      - ''
    resources:
      - serviceaccounts
      - namespaces
      - secrets
      - configmaps
      - persistentvolumeclaims
      - persistentvolume
      - services
  - verbs:
      - get
      - list
      - create
      - patch
      - delete
    apiGroups:
      - apps
    resources:
      - statefulsets
      - deployments
      - deployments/scale
  - verbs:
      - get
      - list
      - create
      - patch
      - delete
    apiGroups:
      - networking.k8s.io
    resources:
      - ingresses
  - verbs:
      - get
      - list
      - create
      - patch
      - delete
    apiGroups:
      - networking.k8s.io
    resources:
      - networkpolicies
  - verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
    apiGroups:
      - rbac.authorization.k8s.io
    resources:
      - roles
      - rolebindings
  - verbs:
      - get
      - list
      - create
      - update
      - patch
      - delete
    apiGroups:
      - batch
    resources:
      - cronjobs
      - jobs
      - jobs/status
  - verbs:
      - get
      - list
      - watch
      - delete
    apiGroups:
      - ''
    resources:
      - pods
      - pods/log
  - verbs:
      - get
      - list
      - create
      - patch
      - delete
    apiGroups:
      - cert-manager.io
    resources:
      - certificates
      - certificates/status
  - verbs:
      - get
      - list
      - watch
      - create
      - patch
      - delete
    apiGroups:
      - postgresql.cnpg.io
    resources:
      - clusters
      - scheduledbackups
      - backups
  - verbs:
      - get
      - list
      - watch
      - create
      - patch
      - delete
      - update
    apiGroups:
      - barmancloud.cnpg.io
    resources:
      - objectstores
  - verbs:
      - get
      - patch
      - update
    apiGroups:
      - barmancloud.cnpg.io
    resources:
      - objectstores/status
  - verbs:
      - get
      - list
      - create
      - patch
      - delete
    apiGroups:
      - redis.redis.opstreelabs.in
    resources:
      - redis
      - redisclusters
  - verbs:
      - get
      - create
    apiGroups:
      - ''
    resources:
      - pods/exec
