apiVersion: v1
kind: ConfigMap
metadata:
  name: tenant-log-export-config
  namespace: cabotage
data:
  fluent-bit.yaml: |
    service:
      flush: 1
      log_level: info
      # Only the reload sidecar talks to the HTTP server.
      http_server: on
      http_listen: 127.0.0.1
      http_port: 2020
      hot_reload: on
      storage.path: /var/lib/fluent-bit/storage
      storage.sync: normal
      storage.backlog.mem_limit: 16M
      # A hot reload waits for every pending chunk. Tenant outputs set a
      # bounded retry_limit; a short backoff cap keeps a dead destination
      # from pausing every tenant's export for long.
      scheduler.base: 2
      scheduler.cap: 10

    # Tenant outputs rendered by cabotage. ..data is the kubelet's atomic
    # snapshot of the Secret; the per-key symlinks are updated after the
    # swap that triggers a reload, so globbing them races.
    includes:
      - /fluent-bit/tenants/..data/*.yaml

    parsers:
      - name: tenant_export_json
        format: json

    pipeline:
      inputs:
        # resident-alloy's tenant_export branch; tags records v1_logs.
        - name: opentelemetry
          listen: 0.0.0.0
          port: 4318
          tag_from_uri: true
          storage.type: filesystem
          tls: on
          tls.crt_file: /fluent-bit/tls/tls.crt
          tls.key_file: /fluent-bit/tls/tls.key
      filters:
        # Alloy packs the routing labels and the original line (_entry).
        - name: parser
          match: v1_logs
          key_name: log
          parser: tenant_export_json
        - name: rewrite_tag
          match: v1_logs
          rule: $app ^(.+)$ tenant.$namespace.$app false
          emitter_storage.type: filesystem
