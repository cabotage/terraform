apiVersion: v1
kind: ConfigMap
metadata:
  name: resident-mimir-rules
  namespace: cabotage
data:
  rules.yml: |
    groups:
      - name: traefik_latency
        interval: 10s
        rules:
          - record: traefik:router_request_duration_seconds_bucket:rate30s
            expr: sum by (le, service) (rate(traefik_router_request_duration_seconds_bucket[30s]))
          - record: traefik:router_request_duration_seconds_bucket:rate1m
            expr: sum by (le, service) (rate(traefik_router_request_duration_seconds_bucket[1m]))
          - record: traefik:router_request_duration_seconds_bucket:rate5m
            expr: sum by (le, service) (rate(traefik_router_request_duration_seconds_bucket[5m]))

          - record: traefik:router_request_duration_seconds:p99_1m
            expr: histogram_quantile(0.99, traefik:router_request_duration_seconds_bucket:rate1m)

          - alert: TraefikHighLatency
            expr: |
              (
                traefik:router_request_duration_seconds:p99_1m > 5
              ) and on (service) (
                traefik:router_requests:rate1m > 0.1
              )
            for: 2m
            keep_firing_for: 30s
            labels:
              severity: warning
            annotations:
              summary: "High p99 latency on {{ $labels.service }}"
              description: "Router {{ $labels.service }} has a p99 latency of {{ $value | humanizeDuration }} over the last minute."

          - alert: TraefikVeryHighLatency
            expr: |
              (
                traefik:router_request_duration_seconds:p99_1m > 15
              ) and on (service) (
                traefik:router_requests:rate1m > 0.1
              )
            for: 1m
            keep_firing_for: 30s
            labels:
              severity: critical
            annotations:
              summary: "Very high p99 latency on {{ $labels.service }}"
              description: "Router {{ $labels.service }} has a p99 latency of {{ $value | humanizeDuration }} over the last minute."

      - name: traefik_error_rates
        interval: 10s
        rules:
          - record: traefik:router_requests:rate1m
            expr: sum by (service) (rate(traefik_router_requests_total[1m]))

          - record: traefik:router_requests_5xx:rate1m
            expr: sum by (service) (rate(traefik_router_requests_total{code=~"5.."}[1m]))

          - record: traefik:router_error_ratio:rate1m
            expr: |
              traefik:router_requests_5xx:rate1m
              / on (service)
              traefik:router_requests:rate1m

          - alert: TraefikHighErrorRate
            expr: |
              (
                traefik:router_error_ratio:rate1m > 0.05
              ) and on (service) (
                traefik:router_requests:rate1m > 0.1
              )
            for: 1m
            keep_firing_for: 30s
            labels:
              severity: warning
            annotations:
              summary: "High 5xx error rate on {{ $labels.service }}"
              description: "Router {{ $labels.service }} has a 5xx error rate of {{ $value | humanizePercentage }} over the last minute."

          - alert: TraefikVeryHighErrorRate
            expr: |
              (
                traefik:router_error_ratio:rate1m > 0.25
              ) and on (service) (
                traefik:router_requests:rate1m > 0.1
              )
            for: 30s
            keep_firing_for: 30s
            labels:
              severity: critical
            annotations:
              summary: "Very high 5xx error rate on {{ $labels.service }}"
              description: "Router {{ $labels.service }} has a 5xx error rate of {{ $value | humanizePercentage }} over the last minute."

      - name: resident_deployment_alerts
        interval: 10s
        rules:
          - record: cabotage:resident_deployment_pod
            expr: |
              kube_pod_owner{owner_kind="ReplicaSet"}
              * on (namespace, owner_name) group_left(deployment)
              label_replace(
                label_replace(
                  kube_replicaset_owner{owner_kind="Deployment"}
                  * on (namespace, owner_name) group_left(label_organization, label_project, label_application, label_process)
                  label_replace(
                    kube_deployment_labels{label_resident_deployment_cabotage_io="true"},
                    "owner_name", "$1", "deployment", "(.*)"
                  ),
                  "deployment", "$1", "owner_name", "(.*)"
                ),
                "owner_name", "$1", "replicaset", "(.*)"
              )
              and on (namespace, owner_name)
              label_replace(
                kube_replicaset_status_replicas > 0,
                "owner_name", "$1", "replicaset", "(.*)"
              )

          - alert: ResidentDeploymentOOMKilled
            expr: |
              max by (namespace, deployment, label_organization, label_project, label_application, label_process) (
                (
                  max_over_time(
                    kube_pod_container_status_last_terminated_reason{reason="OOMKilled"}[10m]
                  ) >= 1
                )
                * on (namespace, pod) group_left(deployment, label_organization, label_project, label_application, label_process)
                cabotage:resident_deployment_pod
              ) > 0
            for: 0m
            labels:
              severity: critical
            annotations:
              summary: "Deployment {{ $labels.namespace }}/{{ $labels.deployment }} has OOM killed pods"
              description: "A container in deployment {{ $labels.deployment }} was terminated due to OOM."

          - alert: ResidentDeploymentCrashLoopBackOff
            expr: |
              max by (namespace, deployment, label_organization, label_project, label_application, label_process) (
                (
                  max_over_time(
                    kube_pod_container_status_waiting_reason{reason="CrashLoopBackOff"}[10m]
                  ) >= 1
                )
                * on (namespace, pod) group_left(deployment, label_organization, label_project, label_application, label_process)
                cabotage:resident_deployment_pod
              ) > 0
            for: 15s
            labels:
              severity: critical
            annotations:
              summary: "Deployment {{ $labels.namespace }}/{{ $labels.deployment }} has pods in CrashLoopBackOff"
              description: "A container in deployment {{ $labels.deployment }} is in CrashLoopBackOff."

          - alert: ResidentDeploymentContainerWaiting
            expr: |
              max by (namespace, deployment, label_organization, label_project, label_application, label_process) (
                (
                  max_over_time(
                    kube_pod_container_status_waiting_reason{reason!~"CrashLoopBackOff|ContainerCreating|PodInitializing"}[10m]
                  ) >= 1
                )
                * on (namespace, pod) group_left(deployment, label_organization, label_project, label_application, label_process)
                cabotage:resident_deployment_pod
              ) > 0
            for: 15s
            labels:
              severity: warning
            annotations:
              summary: "Deployment {{ $labels.namespace }}/{{ $labels.deployment }} has containers in a waiting state"
              description: "A container in deployment {{ $labels.deployment }} is waiting (e.g. ImagePullBackOff, ErrImagePull)."

          - alert: ResidentDeploymentPodNotReady
            expr: |
              max by (namespace, deployment, label_organization, label_project, label_application, label_process) (
                (kube_pod_status_phase{phase=~"Failed|Unknown"} == 1)
                * on (namespace, pod) group_left(deployment, label_organization, label_project, label_application, label_process)
                cabotage:resident_deployment_pod
              ) > 0
            for: 15s
            labels:
              severity: warning
            annotations:
              summary: "Deployment {{ $labels.namespace }}/{{ $labels.deployment }} has pods in a failed state"
              description: "A pod in deployment {{ $labels.deployment }} is in Failed or Unknown phase."

          - alert: ResidentDeploymentHighRestartRate
            expr: |
              max by (namespace, deployment, label_organization, label_project, label_application, label_process) (
                rate(kube_pod_container_status_restarts_total[15m])
                * on (namespace, pod) group_left(deployment, label_organization, label_project, label_application, label_process)
                cabotage:resident_deployment_pod
              ) > 0.0022
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Deployment {{ $labels.namespace }}/{{ $labels.deployment }} has a high container restart rate"
              description: "A container in deployment {{ $labels.deployment }} is restarting frequently without entering CrashLoopBackOff."

          - alert: ResidentDeploymentReplicasUnavailable
            expr: |
              (
                kube_deployment_spec_replicas
                * on (namespace, deployment) group_left(label_organization, label_project, label_application, label_process)
                kube_deployment_labels{label_resident_deployment_cabotage_io="true"}
              )
              -
              (
                kube_deployment_status_replicas_available
                * on (namespace, deployment) group_left()
                kube_deployment_labels{label_resident_deployment_cabotage_io="true"}
              )
              > 0
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Deployment {{ $labels.namespace }}/{{ $labels.deployment }} has unavailable replicas"
              description: "Deployment {{ $labels.deployment }} has {{ $value }} fewer available replicas than desired."

      - name: cadvisor_enrichment
        interval: 30s
        rules:
          - record: cabotage:container_cpu_usage_seconds:rate1m
            expr: |
              sum by (namespace, pod, container,
                      label_cabotage_io_organization, label_cabotage_io_project, label_cabotage_io_application, label_cabotage_io_environment,
                      label_organization, label_project, label_application, label_environment) (
                rate(container_cpu_usage_seconds_total[1m])
                * on (namespace, pod) group_left(
                    label_cabotage_io_organization, label_cabotage_io_project, label_cabotage_io_application, label_cabotage_io_environment,
                    label_organization, label_project, label_application, label_environment
                  )
                kube_pod_labels
              )

          - record: cabotage:container_memory_working_set_bytes
            expr: |
              container_memory_working_set_bytes
              * on (namespace, pod) group_left(
                  label_cabotage_io_organization, label_cabotage_io_project, label_cabotage_io_application, label_cabotage_io_environment,
                  label_organization, label_project, label_application, label_environment
                )
              kube_pod_labels

          - record: cabotage:container_network_receive_bytes:rate1m
            expr: |
              sum by (namespace, pod,
                      label_cabotage_io_organization, label_cabotage_io_project, label_cabotage_io_application, label_cabotage_io_environment,
                      label_organization, label_project, label_application, label_environment) (
                rate(container_network_receive_bytes_total[1m])
                * on (namespace, pod) group_left(
                    label_cabotage_io_organization, label_cabotage_io_project, label_cabotage_io_application, label_cabotage_io_environment,
                    label_organization, label_project, label_application, label_environment
                  )
                kube_pod_labels
              )

          - record: cabotage:container_network_transmit_bytes:rate1m
            expr: |
              sum by (namespace, pod,
                      label_cabotage_io_organization, label_cabotage_io_project, label_cabotage_io_application, label_cabotage_io_environment,
                      label_organization, label_project, label_application, label_environment) (
                rate(container_network_transmit_bytes_total[1m])
                * on (namespace, pod) group_left(
                    label_cabotage_io_organization, label_cabotage_io_project, label_cabotage_io_application, label_cabotage_io_environment,
                    label_organization, label_project, label_application, label_environment
                  )
                kube_pod_labels
              )

          - record: cabotage:container_fs_usage_bytes
            expr: |
              container_fs_usage_bytes
              * on (namespace, pod) group_left(
                  label_cabotage_io_organization, label_cabotage_io_project, label_cabotage_io_application, label_cabotage_io_environment,
                  label_organization, label_project, label_application, label_environment
                )
              kube_pod_labels
