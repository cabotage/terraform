apiVersion: apps/v1
kind: Deployment
metadata:
  name: alert-echo
  namespace: cabotage
  labels:
    app: alert-echo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alert-echo
  template:
    metadata:
      labels:
        app: alert-echo
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
      containers:
      - name: alert-echo
        image: python:3.12-alpine
        command:
        - python3
        - -c
        - |
          import json, sys
          from http.server import HTTPServer, BaseHTTPRequestHandler
          from datetime import datetime, timezone

          class Handler(BaseHTTPRequestHandler):
              def do_POST(self):
                  length = int(self.headers.get("Content-Length", 0))
                  body = self.rfile.read(length)
                  try:
                      payload = json.loads(body)
                      print(json.dumps(payload, indent=2), flush=True)
                      for alert in payload.get("alerts", []):
                          ts = datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
                          status = alert.get("status", "unknown")
                          name = alert.get("labels", {}).get("alertname", "?")
                          svc = alert.get("labels", {}).get("service", alert.get("labels", {}).get("deployment", "?"))
                          severity = alert.get("labels", {}).get("severity", "?")
                          summary = alert.get("annotations", {}).get("summary", "")
                          print(f"[{ts}] {status.upper():10s} severity={severity} alert={name} service={svc} summary={summary}", flush=True)
                  except Exception as e:
                      print(f"[error] {e}", flush=True)
                      print(f"[raw] {body.decode(errors='replace')}", flush=True)
                  self.send_response(200)
                  self.end_headers()

              def do_GET(self):
                  self.send_response(200)
                  self.end_headers()
                  self.wfile.write(b"ok\n")

              def log_message(self, format, *args):
                  pass  # suppress default access logs

          print("alert-echo listening on :8090", flush=True)
          HTTPServer(("", 8090), Handler).serve_forever()
        ports:
        - containerPort: 8090
          name: http
        readinessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 2
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 2
          periodSeconds: 10
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 50m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
