apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-tailscale-proxy
  namespace: tailscale
spec:
  podSelector:
    matchLabels:
      tailscale.com/managed: "true"
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # WireGuard — direct peer-to-peer connections
    - ports:
        - port: 41641
          protocol: UDP
  egress:
    # DNS resolution (kube-system CoreDNS)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # Tailscale coordination + DERP relay + K8s API + WireGuard + STUN.
    # No cluster-internal except — VPC CNI does not correctly OR
    # multiple egress rules, so a separate rule for the K8s API
    # cannot override an except in this rule.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - port: 443
          protocol: TCP
        - port: 8443
          protocol: TCP
        - port: 41641
          protocol: UDP
        - port: 3478
          protocol: UDP
    # Backend: cabotage-app via Funnel ingress
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cabotage
          podSelector:
            matchLabels:
              app: cabotage-app
              component: web
      ports:
        - port: 8443
          protocol: TCP
    # Backend: tenant services via tailscale ingress
    - to:
        - namespaceSelector:
            matchLabels:
              resident-namespace.cabotage.io: "true"
      ports:
        - port: 8000
          protocol: TCP
