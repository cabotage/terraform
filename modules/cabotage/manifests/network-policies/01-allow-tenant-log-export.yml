apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-tenant-log-export
  namespace: cabotage
spec:
  podSelector:
    matchLabels:
      app: tenant-log-export
  ingress:
    # OTLP from alloy only. Records name their own tenant, so any other
    # client could write into another tenant's Datadog account.
    - from:
        - podSelector:
            matchLabels:
              app: resident-alloy
      ports:
        - port: 4318
          protocol: TCP
