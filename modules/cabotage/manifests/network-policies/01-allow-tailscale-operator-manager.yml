apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-tailscale-operator-manager
  namespace: cabotage
spec:
  podSelector:
    matchLabels:
      app: tailscale-operator-manager
  ingress:
    # Kubelet liveness probe on :8080.
    # The kubelet source IP is not predictable, so this must allow
    # all sources on the probe port (same pattern as ca-admission).
    - ports:
        - port: 8080
          protocol: TCP
