apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: restrict-egress
  namespace: cabotage-tenant-builds
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    # DNS resolution (kube-system CoreDNS)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # Registry via traefik ingress.
    # Calico evaluates egress after DNAT so we must use the traefik
    # container targetPort (8443), not the Service port (443).
    # In minikube (hostNetwork) traefik binds directly on 443.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
      ports:
        - port: 443
          protocol: TCP
        - port: 8443
          protocol: TCP
